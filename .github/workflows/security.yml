name: Security checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || test "$?" -eq 1
      - run: npm sbom --sbom-format=cyclonedx > continuity-binder-sbom.json
