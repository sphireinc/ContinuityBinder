name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high --json > npm-audit.json || test "$?" -eq 1
      - run: npm sbom --sbom-format=cyclonedx > continuity-binder-sbom.json
      - run: grep -q "connect-src 'none'" index.html
      - run: if rg -n "https?://|fonts\.googleapis|fonts\.gstatic" dist --glob '!*.map'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: |
            npm-audit.json
            continuity-binder-sbom.json
